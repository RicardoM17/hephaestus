name: hephaestus
services:
  hephaestus-base:
    build:
      dockerfile: Dockerfile
      pull: false
      context: .
      tags:
        - hephaestus-base:${DOCKER_TAG:-latest}
        - ghcr.io/olympus-robotics/hephaestus:${DOCKER_TAG:-latest}
      args:
        BASE_IMAGE: ubuntu:22.04
    command: 'echo "build is completed"'
  hephaestus:
    # container_name: hephaestus-dev
    deploy:
      mode: replicated
      replicas: 4
    restart: unless-stopped
    image: hephaestus-dev:latest
    build:
      dockerfile: Dockerfile.dev
      pull: false
      context: .
      args:
        BASE_IMAGE: hephaestus-hephaestus-base:latest
    depends_on:
      hephaestus-base:
        condition: service_completed_successfully
    command: tail -F /dev/null
    ports: []
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    shm_size: 512
    security_opt:
      - seccomp:unconfined
    environment:
      DISPLAY: ${DISPLAY:-}
      SCCACHE_SERVER_PORT: 4228
      HEPHAESTUS_PATH: /workspaces/hephaestus
    # devices:
    #   - /dev/dri:/dev/dri
    working_dir: /workspaces/hephaestus
    volumes:
      - /dev:/dev
      - ${HOME}/.config/nvim:/workspaces/.config/nvim
      - ${HOME}/.local:/workspaces/.local
      - ${HOME}/.ssh:/workspaces/.ssh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../:/workspaces/hephaestus
      - shellhistory:/dc/shellhistory
      - vscode-server:/workspaces/.vscode-server
      - cache:/workspaces/.cache
  hephaestus_bridge:
    container_name: hephaestus-bridge
    restart: unless-stopped
    image: gcr.io/sunflower-container-registry/hephaestus-dev:latest
    build:
      dockerfile: Dockerfile.dev
      pull: false
      context: .
      args:
        BASE_IMAGE: gcr.io/sunflower-container-registry/hephaestus-hephaestus-base:latest
    depends_on:
      hephaestus-base:
        condition: service_completed_successfully
    command: tail -F /dev/null
    ports:
      - "4228:4228"  # sccache server
      - "8765:8765"  # websocket bridge
      - "8080:8080"  # hephaestus web interface
      - "3000:3000"  # hephaestus web interface (alternative port)
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    shm_size: 512
    security_opt:
      - seccomp:unconfined
    environment:
      DISPLAY: ${DISPLAY:-}
      SCCACHE_SERVER_PORT: 4228
      HEPHAESTUS_PATH: /workspaces/hephaestus
    # devices:
    #   - /dev/dri:/dev/dri
    working_dir: /workspaces/hephaestus
    volumes:
      - /dev:/dev
      - ${HOME}/.config/nvim:/workspaces/.config/nvim
      - ${HOME}/.local:/workspaces/.local
      - ${HOME}/.ssh:/workspaces/.ssh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../:/workspaces/hephaestus
      - shellhistory:/dc/shellhistory
      - vscode-server:/workspaces/.vscode-server
      - cache:/workspaces/.cache

volumes:
  shellhistory:
  vscode-server:
  cache:
